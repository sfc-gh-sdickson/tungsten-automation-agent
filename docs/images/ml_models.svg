<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <filter id="shLg">
      <feDropShadow dx="2" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="35" text-anchor="middle" fill="#1a1a2e" font-size="24" font-weight="bold">ML Pipeline</text>
  <text x="500" y="58" text-anchor="middle" fill="#666" font-size="12">Data &gt; Notebook (Train) &gt; Model Registry (Log) &gt; UDFs (Predict) &gt; Agent (Invoke)</text>

  <!-- Pipeline stages header -->
  <rect x="30" y="80" width="180" height="45" rx="8" fill="#edf9f0" stroke="#00a843" stroke-width="1.5" filter="url(#sh)"/>
  <text x="120" y="108" text-anchor="middle" fill="#007a31" font-size="13" font-weight="bold">Data Sources</text>
  <line x1="210" y1="102" x2="248" y2="102" stroke="#00a843" stroke-width="1.5"/>
  <polygon points="246,98 256,102 246,106" fill="#00a843"/>

  <rect x="260" y="80" width="200" height="45" rx="8" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="360" y="108" text-anchor="middle" fill="#b33f08" font-size="13" font-weight="bold">07_ml_models.ipynb</text>
  <line x1="460" y1="102" x2="498" y2="102" stroke="#e8530e" stroke-width="1.5"/>
  <polygon points="496,98 506,102 496,106" fill="#e8530e"/>

  <rect x="510" y="80" width="180" height="45" rx="8" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="600" y="108" text-anchor="middle" fill="#0e7fad" font-size="13" font-weight="bold">Model Registry</text>
  <line x1="690" y1="102" x2="728" y2="102" stroke="#29b5e8" stroke-width="1.5"/>
  <polygon points="726,98 736,102 726,106" fill="#29b5e8"/>

  <rect x="740" y="80" width="220" height="45" rx="8" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="108" text-anchor="middle" fill="#5a3ec8" font-size="13" font-weight="bold">SQL UDFs &gt; Agent</text>

  <!-- Model 1: Churn -->
  <rect x="30" y="160" width="460" height="85" rx="10" fill="#eaf7fc" stroke="#29b5e8" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="185" fill="#0e7fad" font-size="14" font-weight="bold">Model 1: Customer Churn Risk</text>
  <text x="50" y="205" fill="#555" font-size="11">Algorithm: RandomForest Classifier (100 trees, max_depth=5)</text>
  <text x="50" y="225" fill="#555" font-size="11">Features: avg_docs, usage_trend, ticket_count, avg_csat, days_to_renewal</text>
  <text x="50" y="240" fill="#555" font-size="11">Target: Binary (churn in 90 days)</text>

  <rect x="520" y="160" width="450" height="85" rx="10" fill="#fff" stroke="#29b5e8" stroke-width="1" filter="url(#sh)"/>
  <text x="540" y="185" fill="#0e7fad" font-size="12" font-weight="bold">CHURN_RISK_MODEL (V1)</text>
  <text x="540" y="205" fill="#555" font-size="11">UDF: AGENT_PREDICT_CHURN_RISK()</text>
  <text x="540" y="225" fill="#555" font-size="11">Returns: Top 20 at-risk customers with probability scores</text>
  <text x="540" y="240" fill="#555" font-size="11">Agent Tool: PredictChurnRisk</text>

  <!-- Model 2: Extraction Accuracy -->
  <rect x="30" y="260" width="460" height="85" rx="10" fill="#f3f0ff" stroke="#7b61ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="285" fill="#5a3ec8" font-size="14" font-weight="bold">Model 2: Extraction Accuracy Prediction</text>
  <text x="50" y="305" fill="#555" font-size="11">Algorithm: GradientBoosting Regressor (50 estimators, max_depth=3)</text>
  <text x="50" y="325" fill="#555" font-size="11">Features: sample_count, avg_pages, current_accuracy</text>
  <text x="50" y="340" fill="#555" font-size="11">Target: Predicted accuracy (0-1 continuous)</text>

  <rect x="520" y="260" width="450" height="85" rx="10" fill="#fff" stroke="#7b61ff" stroke-width="1" filter="url(#sh)"/>
  <text x="540" y="285" fill="#5a3ec8" font-size="12" font-weight="bold">EXTRACTION_ACCURACY_MODEL (V1)</text>
  <text x="540" y="305" fill="#555" font-size="11">UDF: AGENT_PREDICT_EXTRACTION_ACCURACY()</text>
  <text x="540" y="325" fill="#555" font-size="11">Returns: Doc type accuracy forecast + retraining recommendations</text>
  <text x="540" y="340" fill="#555" font-size="11">Agent Tool: PredictExtractionAccuracy</text>

  <!-- Model 3: Invoice Anomaly -->
  <rect x="30" y="360" width="460" height="85" rx="10" fill="#fff3ed" stroke="#e8530e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="385" fill="#b33f08" font-size="14" font-weight="bold">Model 3: Invoice Processing Anomaly Detection</text>
  <text x="50" y="405" fill="#555" font-size="11">Algorithm: Isolation Forest (100 estimators, 5% contamination)</text>
  <text x="50" y="425" fill="#555" font-size="11">Features: amount, delivery_time_sec, submit_hour</text>
  <text x="50" y="440" fill="#555" font-size="11">Target: Anomaly score (unsupervised)</text>

  <rect x="520" y="360" width="450" height="85" rx="10" fill="#fff" stroke="#e8530e" stroke-width="1" filter="url(#sh)"/>
  <text x="540" y="385" fill="#b33f08" font-size="12" font-weight="bold">INVOICE_ANOMALY_MODEL (V1)</text>
  <text x="540" y="405" fill="#555" font-size="11">UDF: AGENT_DETECT_INVOICE_ANOMALY()</text>
  <text x="540" y="425" fill="#555" font-size="11">Returns: Top 20 anomalous transactions with type classification</text>
  <text x="540" y="440" fill="#555" font-size="11">Agent Tool: DetectInvoiceAnomaly</text>

  <!-- Model 4: Capacity -->
  <rect x="30" y="460" width="460" height="85" rx="10" fill="#edf9f0" stroke="#00a843" stroke-width="1.5" filter="url(#sh)"/>
  <text x="50" y="485" fill="#007a31" font-size="14" font-weight="bold">Model 4: Platform Capacity Forecasting</text>
  <text x="50" y="505" fill="#555" font-size="11">Algorithm: GradientBoosting Regressor (50 estimators, max_depth=3)</text>
  <text x="50" y="525" fill="#555" font-size="11">Features: avg_queue, std_queue, max_queue</text>
  <text x="50" y="540" fill="#555" font-size="11">Target: Next-period queue depth (regression)</text>

  <rect x="520" y="460" width="450" height="85" rx="10" fill="#fff" stroke="#00a843" stroke-width="1" filter="url(#sh)"/>
  <text x="540" y="485" fill="#007a31" font-size="12" font-weight="bold">CAPACITY_FORECAST_MODEL (V1)</text>
  <text x="540" y="505" fill="#555" font-size="11">UDF: AGENT_FORECAST_CAPACITY()</text>
  <text x="540" y="525" fill="#555" font-size="11">Returns: Per-region queue forecasts + scaling recommendations</text>
  <text x="540" y="540" fill="#555" font-size="11">Agent Tool: ForecastCapacity</text>

  <!-- Footer -->
  <text x="500" y="580" text-anchor="middle" fill="#666" font-size="11">All models versioned in Snowflake Model Registry. UDFs call MODEL(name, version)!PREDICT(). Never hardcode thresholds.</text>
</svg>
