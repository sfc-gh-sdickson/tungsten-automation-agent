<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="mlGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E65100"/>
      <stop offset="100%" style="stop-color:#FF9800"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#f8fafc"/>
  <rect x="0" y="0" width="800" height="45" fill="url(#mlGrad)"/>
  <text x="400" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="bold">ML Pipeline — Train, Register, Predict</text>

  <!-- Data Sources -->
  <rect x="30" y="70" width="160" height="100" rx="6" fill="#E8F5E9" stroke="#A5D6A7"/>
  <text x="110" y="92" text-anchor="middle" fill="#2E7D32" font-size="10" font-weight="bold">Data Sources</text>
  <text x="110" y="110" text-anchor="middle" fill="#1B5E20" font-size="9">CUSTOMER_USAGE_METRICS</text>
  <text x="110" y="124" text-anchor="middle" fill="#1B5E20" font-size="9">SUPPORT_TICKETS</text>
  <text x="110" y="138" text-anchor="middle" fill="#1B5E20" font-size="9">CLASSIFICATION_EVENTS</text>
  <text x="110" y="152" text-anchor="middle" fill="#1B5E20" font-size="9">INVOICE_TRANSACTIONS</text>
  <text x="110" y="166" text-anchor="middle" fill="#1B5E20" font-size="9">PLATFORM_HEALTH_METRICS</text>

  <!-- Training (Notebook) -->
  <rect x="230" y="70" width="200" height="100" rx="6" fill="#FFF3E0" stroke="#FFB74D"/>
  <text x="330" y="92" text-anchor="middle" fill="#E65100" font-size="10" font-weight="bold">07_ml_models.ipynb</text>
  <text x="330" y="112" text-anchor="middle" fill="#BF360C" font-size="9">Feature Engineering</text>
  <text x="330" y="128" text-anchor="middle" fill="#BF360C" font-size="9">Train/Test Split (80/20)</text>
  <text x="330" y="144" text-anchor="middle" fill="#BF360C" font-size="9">Model Training (sklearn)</text>
  <text x="330" y="160" text-anchor="middle" fill="#BF360C" font-size="9">Metrics Evaluation</text>

  <!-- Model Registry -->
  <rect x="470" y="70" width="160" height="100" rx="6" fill="#E3F2FD" stroke="#90CAF9"/>
  <text x="550" y="92" text-anchor="middle" fill="#1565C0" font-size="10" font-weight="bold">Model Registry</text>
  <text x="550" y="112" text-anchor="middle" fill="#0D47A1" font-size="9">registry.log_model()</text>
  <text x="550" y="128" text-anchor="middle" fill="#0D47A1" font-size="9">mv.set_metric()</text>
  <text x="550" y="144" text-anchor="middle" fill="#0D47A1" font-size="9">Versioned (V1, V2...)</text>
  <text x="550" y="160" text-anchor="middle" fill="#0D47A1" font-size="9">Conda dependencies</text>

  <!-- UDFs -->
  <rect x="670" y="70" width="110" height="100" rx="6" fill="#F3E5F5" stroke="#CE93D8"/>
  <text x="725" y="92" text-anchor="middle" fill="#6A1B9A" font-size="10" font-weight="bold">SQL UDFs</text>
  <text x="725" y="112" text-anchor="middle" fill="#4A148C" font-size="9">MODEL(name,</text>
  <text x="725" y="126" text-anchor="middle" fill="#4A148C" font-size="9">version)</text>
  <text x="725" y="140" text-anchor="middle" fill="#4A148C" font-size="9">!PREDICT(...)</text>
  <text x="725" y="158" text-anchor="middle" fill="#4A148C" font-size="9">RETURNS ARRAY</text>

  <!-- Arrows between stages -->
  <path d="M 190 120 L 230 120" stroke="#388E3C" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M 430 120 L 470 120" stroke="#E65100" stroke-width="2" fill="none"/>
  <path d="M 630 120 L 670 120" stroke="#1565C0" stroke-width="2" fill="none"/>

  <!-- 4 Models -->
  <rect x="30" y="210" width="350" height="35" rx="5" fill="#1565C0"/>
  <text x="205" y="232" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Model 1: CHURN_RISK_MODEL (RandomForest Classifier)</text>

  <rect x="30" y="255" width="350" height="35" rx="5" fill="#7B1FA2"/>
  <text x="205" y="277" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Model 2: EXTRACTION_ACCURACY_MODEL (GBR)</text>

  <rect x="30" y="300" width="350" height="35" rx="5" fill="#E65100"/>
  <text x="205" y="322" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Model 3: INVOICE_ANOMALY_MODEL (IsolationForest)</text>

  <rect x="30" y="345" width="350" height="35" rx="5" fill="#2E7D32"/>
  <text x="205" y="367" text-anchor="middle" fill="white" font-size="11" font-weight="bold">Model 4: CAPACITY_FORECAST_MODEL (GBR)</text>

  <!-- UDF names -->
  <rect x="420" y="210" width="360" height="35" rx="5" fill="#BBDEFB" stroke="#1565C0"/>
  <text x="600" y="232" text-anchor="middle" fill="#0D47A1" font-size="10">AGENT_PREDICT_CHURN_RISK() → Top 20 at-risk customers + scores</text>

  <rect x="420" y="255" width="360" height="35" rx="5" fill="#E1BEE7" stroke="#7B1FA2"/>
  <text x="600" y="277" text-anchor="middle" fill="#4A148C" font-size="10">AGENT_PREDICT_EXTRACTION_ACCURACY() → Doc type accuracy forecast</text>

  <rect x="420" y="300" width="360" height="35" rx="5" fill="#FFF3E0" stroke="#E65100"/>
  <text x="600" y="322" text-anchor="middle" fill="#BF360C" font-size="10">AGENT_DETECT_INVOICE_ANOMALY() → Flagged transactions + types</text>

  <rect x="420" y="345" width="360" height="35" rx="5" fill="#E8F5E9" stroke="#2E7D32"/>
  <text x="600" y="367" text-anchor="middle" fill="#1B5E20" font-size="10">AGENT_FORECAST_CAPACITY() → Region queue predictions</text>

  <!-- Arrows model to UDF -->
  <path d="M 380 227 L 420 227" stroke="#1565C0" stroke-width="1.5" fill="none"/>
  <path d="M 380 272 L 420 272" stroke="#7B1FA2" stroke-width="1.5" fill="none"/>
  <path d="M 380 317 L 420 317" stroke="#E65100" stroke-width="1.5" fill="none"/>
  <path d="M 380 362 L 420 362" stroke="#2E7D32" stroke-width="1.5" fill="none"/>

  <!-- Pipeline label -->
  <text x="400" y="420" text-anchor="middle" fill="#546E7A" font-size="11">Data → Notebook (train) → Registry (log_model) → UDFs (MODEL!PREDICT) → Agent (generic tool)</text>
  <text x="400" y="440" text-anchor="middle" fill="#78909C" font-size="10">All models versioned. Never use hardcoded thresholds — always call registered models.</text>
</svg>
