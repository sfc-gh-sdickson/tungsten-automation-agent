<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="hdrGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#29B5E8"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#f8fafc"/>
  <rect x="0" y="0" width="800" height="45" fill="url(#hdrGrad)"/>
  <text x="400" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="bold">Deployment Flow — Execution Order</text>

  <!-- Steps -->
  <rect x="50" y="65" width="180" height="45" rx="6" fill="#1565C0"/>
  <text x="140" y="85" text-anchor="middle" fill="white" font-size="10" font-weight="bold">01 Database + Schema</text>
  <text x="140" y="100" text-anchor="middle" fill="#BBDEFB" font-size="9">TA_INTELLIGENCE, RAW/ANALYTICS/REF</text>

  <rect x="50" y="125" width="180" height="45" rx="6" fill="#1976D2"/>
  <text x="140" y="145" text-anchor="middle" fill="white" font-size="10" font-weight="bold">02 Create Tables</text>
  <text x="140" y="160" text-anchor="middle" fill="#BBDEFB" font-size="9">11 RAW + 8 REFERENCE tables</text>

  <rect x="50" y="185" width="180" height="45" rx="6" fill="#1E88E5"/>
  <text x="140" y="205" text-anchor="middle" fill="white" font-size="10" font-weight="bold">03 Synthetic Data</text>
  <text x="140" y="220" text-anchor="middle" fill="#BBDEFB" font-size="9">~500K docs, 100 customers, 12mo</text>

  <rect x="50" y="245" width="180" height="45" rx="6" fill="#42A5F5"/>
  <text x="140" y="265" text-anchor="middle" fill="white" font-size="10" font-weight="bold">03b Industry Standards</text>
  <text x="140" y="280" text-anchor="middle" fill="#E3F2FD" font-size="9">APQC, Dublin Core, UBL, ITIL</text>

  <rect x="300" y="65" width="180" height="45" rx="6" fill="#7B1FA2"/>
  <text x="390" y="85" text-anchor="middle" fill="white" font-size="10" font-weight="bold">04 Analytical Views</text>
  <text x="390" y="100" text-anchor="middle" fill="#E1BEE7" font-size="9">7 views joining RAW + REF</text>

  <rect x="300" y="125" width="180" height="45" rx="6" fill="#8E24AA"/>
  <text x="390" y="145" text-anchor="middle" fill="white" font-size="10" font-weight="bold">05 Semantic Views</text>
  <text x="390" y="160" text-anchor="middle" fill="#E1BEE7" font-size="9">6 domain-specific SVs</text>

  <rect x="300" y="185" width="180" height="45" rx="6" fill="#AB47BC"/>
  <text x="390" y="205" text-anchor="middle" fill="white" font-size="10" font-weight="bold">06 Cortex Search</text>
  <text x="390" y="220" text-anchor="middle" fill="#F3E5F5" font-size="9">Product Docs + Standards</text>

  <rect x="550" y="65" width="200" height="45" rx="6" fill="#E65100"/>
  <text x="650" y="85" text-anchor="middle" fill="white" font-size="10" font-weight="bold">07 ML Models (Notebook)</text>
  <text x="650" y="100" text-anchor="middle" fill="#FFF3E0" font-size="9">Train + Register 4 models</text>

  <rect x="550" y="125" width="200" height="45" rx="6" fill="#F57C00"/>
  <text x="650" y="145" text-anchor="middle" fill="white" font-size="10" font-weight="bold">08 ML Model UDFs</text>
  <text x="650" y="160" text-anchor="middle" fill="#FFF3E0" font-size="9">4 UDFs calling MODEL()!PREDICT</text>

  <rect x="550" y="185" width="200" height="45" rx="6" fill="#FF9800"/>
  <text x="650" y="205" text-anchor="middle" fill="white" font-size="10" font-weight="bold">09 Create Agent</text>
  <text x="650" y="220" text-anchor="middle" fill="#FFF3E0" font-size="9">12 tools wired in YAML</text>

  <!-- Arrows -->
  <path d="M 140 110 L 140 125" stroke="#1565C0" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 140 170 L 140 185" stroke="#1976D2" stroke-width="2" fill="none"/>
  <path d="M 140 230 L 140 245" stroke="#1E88E5" stroke-width="2" fill="none"/>
  <path d="M 230 267 L 300 87" stroke="#42A5F5" stroke-width="1.5" fill="none" stroke-dasharray="4"/>
  <path d="M 390 110 L 390 125" stroke="#7B1FA2" stroke-width="2" fill="none"/>
  <path d="M 390 170 L 390 185" stroke="#8E24AA" stroke-width="2" fill="none"/>
  <path d="M 480 207 L 550 87" stroke="#AB47BC" stroke-width="1.5" fill="none" stroke-dasharray="4"/>
  <path d="M 650 110 L 650 125" stroke="#E65100" stroke-width="2" fill="none"/>
  <path d="M 650 170 L 650 185" stroke="#F57C00" stroke-width="2" fill="none"/>

  <!-- Final result box -->
  <rect x="200" y="330" width="400" height="60" rx="10" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
  <text x="400" y="355" text-anchor="middle" fill="white" font-size="13" font-weight="bold">Tungsten Automation Agent LIVE</text>
  <text x="400" y="375" text-anchor="middle" fill="#C8E6C9" font-size="10">6 Analyst + 2 Search + 4 ML = 12 Tools</text>

  <path d="M 650 230 L 400 330" stroke="#2E7D32" stroke-width="2" fill="none"/>

  <!-- Legend -->
  <rect x="50" y="420" width="15" height="15" fill="#1565C0"/>
  <text x="72" y="432" fill="#333" font-size="10">SQL Setup + Data</text>
  <rect x="200" y="420" width="15" height="15" fill="#7B1FA2"/>
  <text x="222" y="432" fill="#333" font-size="10">Views + Search</text>
  <rect x="350" y="420" width="15" height="15" fill="#E65100"/>
  <text x="372" y="432" fill="#333" font-size="10">ML + Agent</text>
  <rect x="500" y="420" width="15" height="15" fill="#2E7D32"/>
  <text x="522" y="432" fill="#333" font-size="10">Final Deployment</text>

  <text x="400" y="480" text-anchor="middle" fill="#78909C" font-size="10">Execute files in numbered order (01 → 09). Notebook (07) runs in Snowsight.</text>
</svg>
