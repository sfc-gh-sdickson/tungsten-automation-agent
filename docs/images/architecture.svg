  <text x="695" y="700" text-anchor="middle" fill="#555" font-size="10">~52,000 rows</text>
  <text x="695" y="716" text-anchor="middle" fill="#555" font-size="10">6 products x 5 regions</text>
  <text x="695" y="732" text-anchor="middle" fill="#555" font-size="10">Hourly metrics</text>

  <rect x="810" y="660" width="170" height="90" rx="8" fill="#fff" stroke="#00a843" stroke-width="1.5" filter="url(#sh)"/>
