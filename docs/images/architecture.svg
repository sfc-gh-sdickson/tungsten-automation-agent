<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#29B5E8"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="0" y="0" width="900" height="50" fill="url(#headerGrad)"/>
  <text x="450" y="33" text-anchor="middle" fill="white" font-size="18" font-weight="bold">Tungsten Automation Intelligence Agent — Architecture</text>

  <!-- Agent Layer -->
  <rect x="250" y="70" width="400" height="50" rx="8" fill="#1565C0" stroke="#0D47A1" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" fill="white" font-size="14" font-weight="bold">TUNGSTEN_AUTOMATION_AGENT</text>

  <!-- Tool Layer -->
  <rect x="30" y="145" width="840" height="85" rx="6" fill="#E3F2FD" stroke="#90CAF9" stroke-width="1"/>
  <text x="50" y="165" fill="#1565C0" font-size="11" font-weight="bold">TOOLS (12)</text>

  <!-- Analyst Tools -->
  <rect x="40" y="175" width="120" height="40" rx="4" fill="#29B5E8" stroke="#0288D1" stroke-width="1"/>
  <text x="100" y="193" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Doc Processing</text>
  <text x="100" y="206" text-anchor="middle" fill="white" font-size="8">Analyst</text>

  <rect x="170" y="175" width="120" height="40" rx="4" fill="#29B5E8" stroke="#0288D1" stroke-width="1"/>
  <text x="230" y="193" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Workflow</text>
  <text x="230" y="206" text-anchor="middle" fill="white" font-size="8">Analyst</text>

  <rect x="300" y="175" width="120" height="40" rx="4" fill="#29B5E8" stroke="#0288D1" stroke-width="1"/>
  <text x="360" y="193" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Invoice Network</text>
  <text x="360" y="206" text-anchor="middle" fill="white" font-size="8">Analyst</text>

  <rect x="430" y="175" width="120" height="40" rx="4" fill="#29B5E8" stroke="#0288D1" stroke-width="1"/>
  <text x="490" y="193" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Customer Health</text>
  <text x="490" y="206" text-anchor="middle" fill="white" font-size="8">Analyst</text>

  <rect x="560" y="175" width="120" height="40" rx="4" fill="#29B5E8" stroke="#0288D1" stroke-width="1"/>
  <text x="620" y="193" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Platform Ops</text>
  <text x="620" y="206" text-anchor="middle" fill="white" font-size="8">Analyst</text>

  <rect x="690" y="175" width="120" height="40" rx="4" fill="#29B5E8" stroke="#0288D1" stroke-width="1"/>
  <text x="750" y="193" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Revenue</text>
  <text x="750" y="206" text-anchor="middle" fill="white" font-size="8">Analyst</text>

  <!-- Search + ML row -->
  <rect x="40" y="250" width="200" height="35" rx="4" fill="#4CAF50" stroke="#388E3C" stroke-width="1"/>
  <text x="140" y="272" text-anchor="middle" fill="white" font-size="9" font-weight="bold">Cortex Search (Product Docs + Standards)</text>

  <rect x="260" y="250" width="600" height="35" rx="4" fill="#FF9800" stroke="#F57C00" stroke-width="1"/>
  <text x="560" y="272" text-anchor="middle" fill="white" font-size="9" font-weight="bold">ML UDFs: Churn Risk | Extraction Accuracy | Invoice Anomaly | Capacity Forecast</text>

  <!-- Semantic Views Layer -->
  <rect x="30" y="310" width="840" height="55" rx="6" fill="#FFF3E0" stroke="#FFB74D" stroke-width="1"/>
  <text x="50" y="330" fill="#E65100" font-size="11" font-weight="bold">SEMANTIC VIEWS (6 Domain-Specific)</text>
  <text x="50" y="352" fill="#BF360C" font-size="10">TA_DOCUMENT_PROCESSING_SV | TA_WORKFLOW_AUTOMATION_SV | TA_INVOICE_NETWORK_SV | TA_CUSTOMER_HEALTH_SV | TA_PLATFORM_OPERATIONS_SV | TA_REVENUE_BUSINESS_SV</text>

  <!-- Analytical Views Layer -->
  <rect x="30" y="385" width="840" height="40" rx="6" fill="#F3E5F5" stroke="#CE93D8" stroke-width="1"/>
  <text x="50" y="410" fill="#6A1B9A" font-size="11" font-weight="bold">ANALYTICAL VIEWS (ANALYTICS Schema) — V_DOCUMENT_PROCESSING, V_WORKFLOW_PERFORMANCE, V_INVOICE_NETWORK, V_CUSTOMER_HEALTH, V_PLATFORM_HEALTH, V_REVENUE_METRICS</text>

  <!-- Data Layer -->
  <rect x="30" y="445" width="530" height="140" rx="6" fill="#E8F5E9" stroke="#A5D6A7" stroke-width="1"/>
  <text x="50" y="468" fill="#2E7D32" font-size="11" font-weight="bold">RAW Schema (11 Tables)</text>
  <text x="50" y="488" fill="#1B5E20" font-size="9">DOCUMENT_PROCESSING_JOBS | EXTRACTION_RESULTS | CLASSIFICATION_EVENTS</text>
  <text x="50" y="504" fill="#1B5E20" font-size="9">WORKFLOW_INSTANCES | INVOICE_NETWORK_TRANSACTIONS</text>
  <text x="50" y="520" fill="#1B5E20" font-size="9">CUSTOMER_SUBSCRIPTIONS | CUSTOMER_USAGE_METRICS | SUPPORT_TICKETS</text>
  <text x="50" y="536" fill="#1B5E20" font-size="9">PLATFORM_HEALTH_METRICS | CUSTOMER_DIM | PRODUCT_DIM</text>
  <text x="50" y="558" fill="#388E3C" font-size="9" font-style="italic">~500K docs | 100 customers | 12 months</text>

  <rect x="580" y="445" width="290" height="140" rx="6" fill="#FFF8E1" stroke="#FFD54F" stroke-width="1"/>
  <text x="600" y="468" fill="#F57F17" font-size="11" font-weight="bold">REFERENCE Schema (8 Tables)</text>
  <text x="600" y="488" fill="#E65100" font-size="9">APQC_PROCESS_TAXONOMY</text>
  <text x="600" y="504" fill="#E65100" font-size="9">DUBLIN_CORE_DOCUMENT_TYPES</text>
  <text x="600" y="520" fill="#E65100" font-size="9">UBL_INVOICE_ELEMENTS</text>
  <text x="600" y="536" fill="#E65100" font-size="9">EINVOICE_MANDATE_REGISTRY</text>
  <text x="600" y="552" fill="#E65100" font-size="9">ITIL_SERVICE_METRICS | INDUSTRY | GDPR | OCR</text>

  <!-- Connection lines -->
  <line x1="450" y1="120" x2="450" y2="145" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="285" x2="450" y2="310" stroke="#E65100" stroke-width="1.5"/>
  <line x1="450" y1="365" x2="450" y2="385" stroke="#6A1B9A" stroke-width="1.5"/>
  <line x1="300" y1="425" x2="300" y2="445" stroke="#2E7D32" stroke-width="1.5"/>
  <line x1="720" y1="425" x2="720" y2="445" stroke="#F57F17" stroke-width="1.5"/>

  <!-- Database label -->
  <text x="450" y="595" text-anchor="middle" fill="#546E7A" font-size="12" font-weight="bold">TA_INTELLIGENCE Database</text>
</svg>
